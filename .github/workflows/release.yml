name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore Akode.DocxGen.sln --locked-mode

      - name: Build
        run: dotnet build Akode.DocxGen.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Akode.DocxGen.sln --configuration Release --no-build

      - name: Pack dotnet tool
        run: >
          dotnet pack src/Akode.DocxGen.Cli/Akode.DocxGen.Cli.csproj
          --configuration Release
          --no-build
          --output artifacts/packages

      - name: Upload dotnet tool
        uses: actions/upload-artifact@v4
        with:
          name: Akode.DocxGen-dotnet-tool
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  single-file:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            executable: Akode.DocxGen.Cli.exe
          - os: ubuntu-latest
            rid: linux-x64
            executable: Akode.DocxGen.Cli
          - os: macos-latest
            rid: osx-x64
            executable: Akode.DocxGen.Cli
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore runtime
        run: >
          dotnet restore src/Akode.DocxGen.Cli/Akode.DocxGen.Cli.csproj
          --runtime ${{ matrix.rid }}
          --force-evaluate
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false

      - name: Publish single file
        run: >
          dotnet publish src/Akode.DocxGen.Cli/Akode.DocxGen.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugSymbols=false
          -p:DebugType=None
          --output artifacts/publish/${{ matrix.rid }}

      - name: Add notices
        shell: pwsh
        run: |
          ./eng/generate-third-party-notices.ps1
          Copy-Item LICENSE "artifacts/publish/${{ matrix.rid }}/LICENSE"
          Copy-Item THIRD-PARTY-NOTICES.md "artifacts/publish/${{ matrix.rid }}/THIRD-PARTY-NOTICES.md"

      - name: Write checksum
        shell: pwsh
        run: |
          $directory = "artifacts/publish/${{ matrix.rid }}"
          $binary = Join-Path $directory "${{ matrix.executable }}"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.executable }}" |
            Set-Content -Encoding utf8 (Join-Path $directory "SHA256SUMS")

      - name: Upload single-file executable
        uses: actions/upload-artifact@v4
        with:
          name: Akode.DocxGen-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - tool-package
      - single-file
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release assets
        shell: pwsh
        run: |
          $releaseDirectory = "release"
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null

          Copy-Item `
            "artifacts/Akode.DocxGen-dotnet-tool/*.nupkg" `
            $releaseDirectory

          $windowsDirectory = "artifacts/Akode.DocxGen-win-x64"
          Compress-Archive `
            -Path "$windowsDirectory/*" `
            -DestinationPath "$releaseDirectory/Akode.DocxGen-win-x64.zip"

          foreach ($runtimeIdentifier in @("linux-x64", "osx-x64")) {
            $sourceDirectory = "artifacts/Akode.DocxGen-$runtimeIdentifier"
            $executable = Join-Path $sourceDirectory "Akode.DocxGen.Cli"
            chmod +x $executable
            if ($LASTEXITCODE -ne 0) {
              throw "Could not mark $executable as executable."
            }

            tar `
              -czf "$releaseDirectory/Akode.DocxGen-$runtimeIdentifier.tar.gz" `
              -C $sourceDirectory `
              .
            if ($LASTEXITCODE -ne 0) {
              throw "Could not package $runtimeIdentifier."
            }
          }

          Get-ChildItem -LiteralPath $releaseDirectory -File |
            Sort-Object Name |
            ForEach-Object {
              $fileHash = Get-FileHash `
                -Algorithm SHA256 `
                -LiteralPath $_.FullName
              $hash = $fileHash.Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } |
            Set-Content `
              -Encoding utf8 `
              -LiteralPath (Join-Path $releaseDirectory "SHA256SUMS")

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload \
              "$GITHUB_REF_NAME" \
              release/* \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create \
              "$GITHUB_REF_NAME" \
              release/* \
              --generate-notes \
              --title "Akode.DocxGen $GITHUB_REF_NAME" \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi
