name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore DocxGen.sln --locked-mode

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          [xml] $props = Get-Content Directory.Build.props
          $version = [string] $props.Project.PropertyGroup.PackageVersion
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?)$') {
              throw "Tag '$env:GITHUB_REF_NAME' is not a supported semantic version."
            }

            $version = $Matches.version
          }

          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        run: >
          dotnet build DocxGen.sln
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test DocxGen.sln --configuration Release --no-build

      - name: Pack libraries and dotnet tool
        shell: pwsh
        run: |
          $projects = @(
            "src/Akode.DocxGen.Core/Akode.DocxGen.Core.csproj",
            "src/Akode.DocxGen.Docx/Akode.DocxGen.Docx.csproj",
            "src/Akode.DocxGen.Cli/Akode.DocxGen.Cli.csproj"
          )
          foreach ($project in $projects) {
            dotnet pack $project `
              --configuration Release `
              --no-build `
              -p:PackageVersion=${{ steps.version.outputs.value }} `
              --output artifacts/packages
            if ($LASTEXITCODE -ne 0) {
              throw "Could not pack $project."
            }
          }

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: docxgen-nuget
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  publish-nuget:
    if: >
      vars.NUGET_PUBLISH_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main') ||
       startsWith(github.ref, 'refs/tags/v'))
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: docxgen-nuget
          path: artifacts/packages

      - name: Exchange GitHub OIDC token for NuGet API key
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet packages
        shell: pwsh
        run: |
          $packages = @(
            Get-ChildItem `
              -LiteralPath artifacts/packages `
              -Filter *.nupkg `
              -File
          )
          if ($packages.Count -ne 3) {
            throw "Expected exactly three NuGet packages, found $($packages.Count)."
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "Could not publish $($package.Name)."
            }
          }

  single-file:
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            executable: docxgen.exe
          - os: windows-latest
            rid: win-arm64
            executable: docxgen.exe
          - os: ubuntu-latest
            rid: linux-x64
            executable: docxgen
          - os: ubuntu-latest
            rid: linux-arm64
            executable: docxgen
          - os: macos-latest
            rid: osx-x64
            executable: docxgen
          - os: macos-latest
            rid: osx-arm64
            executable: docxgen
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore runtime
        run: >
          dotnet restore src/Akode.DocxGen.Cli/Akode.DocxGen.Cli.csproj
          --runtime ${{ matrix.rid }}
          --force-evaluate
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          [xml] $props = Get-Content Directory.Build.props
          $version = [string] $props.Project.PropertyGroup.PackageVersion
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?)$') {
              throw "Tag '$env:GITHUB_REF_NAME' is not a supported semantic version."
            }

            $version = $Matches.version
          }

          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish single file
        run: >
          dotnet publish src/Akode.DocxGen.Cli/Akode.DocxGen.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:Version=${{ steps.version.outputs.value }}
          -p:DebugSymbols=false
          -p:DebugType=None
          --output artifacts/publish/${{ matrix.rid }}

      - name: Add notices
        shell: pwsh
        run: |
          ./eng/generate-third-party-notices.ps1
          Copy-Item LICENSE "artifacts/publish/${{ matrix.rid }}/LICENSE"
          Copy-Item THIRD-PARTY-NOTICES.md "artifacts/publish/${{ matrix.rid }}/THIRD-PARTY-NOTICES.md"

      - name: Write checksum
        shell: pwsh
        run: |
          $directory = "artifacts/publish/${{ matrix.rid }}"
          $binary = Join-Path $directory "${{ matrix.executable }}"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.executable }}" |
            Set-Content -Encoding utf8 (Join-Path $directory "SHA256SUMS")

      - name: Upload single-file executable
        uses: actions/upload-artifact@v7
        with:
          name: docxgen-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - packages
      - single-file
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package release assets
        shell: pwsh
        run: |
          $releaseDirectory = "release"
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null

          Copy-Item `
            "artifacts/docxgen-nuget/*.nupkg" `
            $releaseDirectory

          foreach ($runtimeIdentifier in @("win-x64", "win-arm64")) {
            $sourceDirectory = "artifacts/docxgen-$runtimeIdentifier"
            Compress-Archive `
              -Path "$sourceDirectory/*" `
              -DestinationPath "$releaseDirectory/docxgen-$runtimeIdentifier.zip"
          }

          foreach ($runtimeIdentifier in @(
            "linux-x64",
            "linux-arm64",
            "osx-x64",
            "osx-arm64"
          )) {
            $sourceDirectory = "artifacts/docxgen-$runtimeIdentifier"
            $executable = Join-Path $sourceDirectory "docxgen"
            chmod +x $executable
            if ($LASTEXITCODE -ne 0) {
              throw "Could not mark $executable as executable."
            }

            tar `
              -czf "$releaseDirectory/docxgen-$runtimeIdentifier.tar.gz" `
              -C $sourceDirectory `
              .
            if ($LASTEXITCODE -ne 0) {
              throw "Could not package $runtimeIdentifier."
            }
          }

          Get-ChildItem -LiteralPath $releaseDirectory -File |
            Sort-Object Name |
            ForEach-Object {
              $fileHash = Get-FileHash `
                -Algorithm SHA256 `
                -LiteralPath $_.FullName
              $hash = $fileHash.Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } |
            Set-Content `
              -Encoding utf8 `
              -LiteralPath (Join-Path $releaseDirectory "SHA256SUMS")

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload \
              "$GITHUB_REF_NAME" \
              release/* \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create \
              "$GITHUB_REF_NAME" \
              release/* \
              --generate-notes \
              --title "DocxGen $GITHUB_REF_NAME" \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi
